<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="słuch'am">
<meta name="application-name" content="słuch'am">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>słuch'am</title>
<style>
:root{
  --bg:#f7f4ee; --card:#fdfbf7; --raised:#efe9df;
  --ink:#1f1b16; --ink2:#5e554a; --ink3:#7b7266;
  --line:rgba(31,27,22,.09); --wave:rgba(31,27,22,.28);
  --rec:#b42318; --rec-ink:#b42318; --ok:#16a34a; --warn:#9a5b0b; --danger:#b42318;
  --pri-bg:#1f1b16; --pri-ink:#fdfbf7; --seg-on:#fdfbf7;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141415; --card:#19191b; --raised:#232325;
    --ink:#ededed; --ink2:#a1a1a6; --ink3:#85858b;
    --line:rgba(237,237,237,.08); --wave:rgba(237,237,237,.26);
    --rec-ink:#e5484d; --ok:#4cc38a; --warn:#e0a458; --danger:#e5484d;
    --pri-bg:#ededed; --pri-ink:#141415; --seg-on:#323235;
  }
}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink3);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;min-height:56px;margin-bottom:8px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:17px;line-height:1;font-weight:600}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--rec);flex:none}
.icon-btn{width:44px;height:44px;margin-right:-12px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink2);transition:background-color .16s var(--ease)}
.icon-btn:hover{background:var(--raised)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-left:-8px;padding:0 8px;border-radius:8px;color:var(--ink2);font-size:15px;transition:background-color .16s var(--ease)}
.back:hover{background:var(--raised)}
.page-title{font:500 28px/1.15 var(--serif);margin:8px 0 20px}

/* surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 12px}
.panel-title{font-size:16px;line-height:24px;font-weight:500;margin:0 0 4px}
.lbl{display:block;font-size:13px;line-height:20px;color:var(--ink2);margin:16px 0 8px}
.lbl.first{margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid transparent;border-radius:10px;padding:12px;min-height:48px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .16s var(--ease),background-color .16s var(--ease)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--ink3);background-color:var(--card)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
textarea{min-height:88px;resize:vertical;line-height:1.45}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--pri-bg);-webkit-appearance:checkbox;appearance:auto}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:var(--ink2)}
details>summary::-webkit-details-marker{display:none}
details>summary .ic{width:16px;height:16px;transition:transform .16s var(--ease)}
details[open]>summary .ic{transform:rotate(90deg)}
.hints{margin-top:8px}
.help{font-size:13px;line-height:20px;color:var(--ink3);margin:12px 0 0}
.mute{font-size:13px;line-height:20px;color:var(--ink3)}
.okc{font-size:13px;line-height:20px;color:var(--ok)}
.err{font-size:13px;line-height:20px;color:var(--danger)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font-size:15px;line-height:1;font-weight:500;white-space:nowrap;transition:background-color .16s var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri-bg);color:var(--pri-ink)}
.btn.sec{background:var(--raised);color:var(--ink)}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{background:var(--raised)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn .ic{width:16px;height:16px}
.btn-rec{width:100%;min-height:56px;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:12px;background:var(--rec);color:#fff;font-size:17px;line-height:1;font-weight:500;transition:transform .12s var(--ease),filter .16s var(--ease)}
.btn-rec:hover{filter:brightness(1.06)}
.btn-rec:active{transform:scale(.98)}
.btn-rec .w{width:12px;height:12px;border-radius:50%;background:#fff}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* archive */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:32px 4px 8px}
.sec-head h2{margin:0;font-size:15px;line-height:20px;font-weight:500}
.count{font:400 12px/16px var(--mono);color:var(--ink3)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.entry{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 16px 12px 20px;text-align:left;border-top:1px solid var(--line);transition:background-color .16s var(--ease)}
.entry:first-child{border-top:0}
.entry:hover,.entry:active{background:var(--raised)}
.entry-main{flex:1;min-width:0}
.entry-title{display:flex;align-items:center;gap:8px;font-size:16px;line-height:22px;font-weight:500}
.entry-title span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.entry-meta{font-size:13px;line-height:20px;color:var(--ink3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.entry-meta .num{font-variant-numeric:tabular-nums}
.entry-meta .state{color:var(--warn)}
.entry>.ic{width:16px;height:16px;color:var(--ink3)}
.empty{padding:24px 20px;font-size:14px;line-height:22px;color:var(--ink3)}

/* recording */
.rec-head{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;color:var(--ink2);min-width:0}
.rec-head b{font-weight:500;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rec-head .rec-dot{animation:live 2.4s ease-in-out infinite}
@keyframes live{50%{opacity:.35}}
.timer{font-size:48px;line-height:1.1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:12px 0 16px}
.wave{display:block;width:100%;height:48px}
.status{font:400 12px/18px var(--mono);color:var(--ink3);margin-top:12px;font-variant-numeric:tabular-nums}
.status .err{font-family:var(--sans);margin-top:4px}
.seg{display:flex;gap:4px;padding:4px;background:var(--raised);border-radius:12px;margin:20px 0 12px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:14px;line-height:1;font-weight:500;color:var(--ink2);transition:background-color .16s var(--ease),color .16s var(--ease)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:12px;padding:12px max(20px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:var(--bg);border-top:1px solid var(--line)}
.dock .btn{flex:1;max-width:300px;min-height:48px}
.finish{flex:1;text-align:center;font-size:14px;line-height:20px;color:var(--ink2);white-space:pre-line;padding:4px 0}
.finish .btn{margin-top:8px}

/* notes */
.md{font-size:16px;line-height:1.55}
.md h1,.md h2{font-size:18px;line-height:26px;font-weight:500;margin:24px 0 8px}
.md h3{font-size:16px;line-height:24px;font-weight:500;margin:16px 0 4px}
.md>:first-child{margin-top:0}
.md p{margin:8px 0}
.md b{font-weight:600}
.md .li{position:relative;padding-left:16px;margin:4px 0}
.md .li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.md .li.l1{margin-left:16px}
.md .li.l1::before{background:none;border:1px solid var(--ink3);width:3px;height:3px}
.md .li.l2{margin-left:32px}
.md .ol{margin:4px 0;font-variant-numeric:tabular-nums}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md .placeholder{color:var(--ink3);font-size:15px;margin:0}
.tr{font-size:14px;line-height:22px;color:var(--ink2);white-space:pre-wrap}

/* lecture page */
.paper{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px 28px;margin:0 0 12px}
.eyebrow{font-size:14px;line-height:20px;color:var(--ink2)}
.doc-title{font:500 28px/1.15 var(--serif);margin:4px 0 8px;overflow-wrap:anywhere}
.doc-meta{font:400 12px/16px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.doc-actions .btn{flex:1 1 0;padding:0 12px}
.doc-actions .btn.pri{flex-basis:100%}
.summary{background:var(--raised);border-radius:12px;padding:16px;margin:24px 0}
.summary.md h1,.summary.md h2{font-size:14px;line-height:20px;color:var(--ink2);margin:16px 0 4px}
.summary.md>:first-child{margin-top:0}
.summary.md .li::before{background:var(--ink2)}
.paper>.md{margin-top:24px}
.notice{display:flex;flex-direction:column;gap:12px}
.notice p{margin:0;font-size:14px;line-height:22px;color:var(--ink2)}
.quiet{display:flex;gap:4px;flex-wrap:wrap;margin:4px -8px 0}
#msg{margin-top:8px}

/* recording extras */
.rec-head.paused .rec-dot{animation:none;opacity:.35}
.btn.mark{width:100%;margin-top:16px}
.btn.pri-soft{background:var(--pri-bg);color:var(--pri-ink)}
.md .li.imp::before{background:var(--rec);width:6px;height:6px;top:10px;left:1px}
.md .li.imp b:first-child{color:var(--rec-ink)}
.gap-note{margin-top:8px;font-size:13px;line-height:20px;color:var(--warn)}
.btn.wide{width:100%;margin:0 0 12px}
.edit-area{min-height:50vh;font-size:15px;line-height:1.5}
.edit-area.short{min-height:120px}
.panel.notice.tight{gap:12px}

/* archive tools */
.arch-tools{margin:0 0 12px}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px;border-radius:10px;background:var(--raised);color:var(--ink3)}
.search input{background:transparent;border:0;padding:0;min-height:44px}
.search input:focus{background:transparent;border:0}
.search input:focus-visible{outline:none}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--ink3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -20px 0;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:var(--raised);color:var(--ink2);font-size:14px;line-height:1;white-space:nowrap;transition:background-color .16s var(--ease),color .16s var(--ease)}
.chip.on{background:var(--pri-bg);color:var(--pri-ink)}
.entry-snip{margin-top:4px;font-size:13px;line-height:20px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-snip mark{background:var(--raised);color:var(--ink);border-radius:3px;padding:0 2px}
.btn.quiz-course{width:100%;margin:0 0 12px}

/* review questions */
.qlist{display:flex;flex-direction:column;gap:8px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 16px}
.qcard>summary{align-items:flex-start;gap:12px;min-height:0;padding:14px 0;font-size:15px;line-height:22px;color:var(--ink)}
.qn{flex:none;min-width:20px;font:400 12px/22px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.qa{padding:0 0 14px 32px;font-size:15px;line-height:22px;color:var(--ink2)}
.qcard[open]>summary{color:var(--ink)}

/* overlays */
#blackout{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0 24px calc(48px + env(safe-area-inset-bottom));background:#000;color:#3d3d3d;font-size:13px;line-height:20px;text-align:center}
#blackout.on{display:flex}
#blackout span{font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;max-width:calc(100% - 40px);transform:translate(-50%,8px);padding:10px 16px;border-radius:10px;background:var(--pri-bg);color:var(--pri-ink);font-size:14px;line-height:20px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* one entrance */
.view>*{animation:rise .36s var(--ease) both}
.view>*:nth-child(2){animation-delay:40ms}
.view>*:nth-child(3){animation-delay:80ms}
.view>*:nth-child(4){animation-delay:120ms}
.view>*:nth-child(5){animation-delay:160ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){
  .view>*,.rec-head .rec-dot{animation:none}
  *{transition-duration:0s!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="blackout"><div>Nagrywanie trwa · <span id="bo-t">00:00</span><br>Dotknij, aby wrócić</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const fmtDur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+':'+pad(m) : pad(m)) + ':' + pad(x); };
const fmtDate = t => new Date(t).toLocaleDateString('pl-PL', {weekday:'short', day:'numeric', month:'long', year:'numeric'});
const fmtTime = t => new Date(t).toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
let toastT; function toast(msg, ms = 2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function dbg(){ try { return JSON.parse(localStorage.getItem('slucham_debug') || '{}'); } catch { return {}; } }

/* ================= settings ================= */
const DEF = {
  sttBase:'https://api.groq.com/openai/v1', sttKey:'', sttModel:'whisper-large-v3',
  llmSame:true, llmBase:'', llmKey:'', llmModel:'openai/gpt-oss-120b',
  lang:'pl', notesEveryMin:5, audioMode:'auto', courses:{}, lastCourse:'', keyOk:false
};
let CFG = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('slucham_cfg') || '{}')); } catch { return Object.assign({}, DEF); } })();
if (!CFG.migr5){ if (CFG.notesEveryMin === 3) CFG.notesEveryMin = 5; CFG.migr5 = true; try { localStorage.setItem('slucham_cfg', JSON.stringify(CFG)); } catch {} }
function saveCfg(){ try { localStorage.setItem('slucham_cfg', JSON.stringify(CFG)); } catch {} }

/* ================= storage (IndexedDB, memory fallback) ================= */
const DB = {
  db:null, mem:new Map(),
  open(){ return new Promise(res => { try { const rq = indexedDB.open('slucham', 2);
    rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('lectures')) d.createObjectStore('lectures', {keyPath:'id'}); if (!d.objectStoreNames.contains('segments')) d.createObjectStore('segments', {keyPath:'key'}); };
    rq.onsuccess = () => { this.db = rq.result; res(); }; rq.onerror = () => res(); } catch { res(); } }); },
  all(){ if (!this.db) return Promise.resolve([...this.mem.values()]);
    return new Promise(res => { try { const rq = this.db.transaction('lectures').objectStore('lectures').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch { res([]); } }); },
  put(l){ this.mem.set(l.id, l); if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction('lectures', 'readwrite'); tx.objectStore('lectures').put(JSON.parse(JSON.stringify(l))); tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res(); } catch { res(); } }); },
  del(id){ this.mem.delete(id); if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction('lectures', 'readwrite'); tx.objectStore('lectures').delete(id); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch { res(); } }); },
  // audio fragments not yet transcribed: kept on the phone until Groq has them
  segPut(r){ if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction('segments', 'readwrite'); tx.objectStore('segments').put(r); tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res(); } catch { res(); } }); },
  segDel(key){ if (!this.db || !key) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction('segments', 'readwrite'); tx.objectStore('segments').delete(key); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch { res(); } }); },
  segAll(){ if (!this.db) return Promise.resolve([]);
    return new Promise(res => { try { const rq = this.db.transaction('segments').objectStore('segments').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch { res([]); } }); }
};
let LECT = [];
const sortLect = () => LECT.sort((a, b) => b.startedAt - a.startedAt);
const transcriptText = L => (L.transcript || []).map(s => s.text).join(' ');

/* ================= API ================= */
function waitFromMsg(msg){
  const m = String(msg || '').match(/try again in\s*((?:\d+(?:\.\d+)?h)?(?:\d+(?:\.\d+)?m(?!s))?(?:\d+(?:\.\d+)?s)?(?:\d+(?:\.\d+)?ms)?)/i);
  if (!m || !m[1]) return 0;
  let t = 0; const g = (re, k) => { const x = m[1].match(re); if (x) t += parseFloat(x[1]) * k; };
  g(/(\d+(?:\.\d+)?)h/, 3600); g(/(\d+(?:\.\d+)?)m(?!s)/, 60); g(/(\d+(?:\.\d+)?)s/, 1); g(/(\d+(?:\.\d+)?)ms/, 0.001);
  return t;
}
async function api(base, key, path, opts = {}){
  let r;
  try { r = await fetch(String(base).replace(/\/+$/, '') + path, {...opts, headers:{Authorization:'Bearer ' + key, ...(opts.headers || {})}}); }
  catch { const e = new Error('Brak połączenia z API (sieć albo blokada w przeglądarce).'); e.net = true; throw e; }
  if (!r.ok){
    let msg = ''; try { const j = await r.json(); msg = (j.error && (j.error.message || j.error)) || JSON.stringify(j).slice(0, 200); } catch {}
    const e = new Error('Błąd API ' + r.status + (msg ? ': ' + String(msg).slice(0, 220) : '')); e.status = r.status; e.retryAfter = parseFloat(r.headers.get('retry-after')) || waitFromMsg(msg); e.daily = /per day|\(TPD\)|\(RPD\)|\(ASD\)/i.test(String(msg)); throw e;
  }
  return r.json();
}

    if (navigator.canShare && navigator.canShare({files:[file]})) return await navigator.share({files:[file], title:fileBase(L)});
    if (navigator.share) return await navigator.share({title:fileBase(L), text:mdPlain(lectureMd(L))});
    saveBlob(file, file.name);
  } catch (e){ if (e && e.name !== 'AbortError') saveBlob(file, file.name); }
}

function backupDue(){
  if (!LECT.length) return null;
  const last = CFG.lastBackupAt || 0, oldest = Math.min(...LECT.map(l => l.startedAt));
  const since = last || oldest, fresh = LECT.some(l => l.startedAt > last && l.status !== 'recording');
  if (!fresh || Date.now() - since < 7 * 86400000 || (CFG.backupSnooze && Date.now() < CFG.backupSnooze)) return null;
  return last ? 'Ostatnia kopia archiwum: ' + Math.floor((Date.now() - last) / 86400000) + ' dni temu.' : 'Nie masz jeszcze kopii archiwum.';
}

function snippet(text, q){
  const f = fold(text), i = f.indexOf(q); if (i < 0) return '';
  let a = Math.max(0, i - 40), b = Math.min(text.length, i + q.length + 60);
  if (a > 0){ const sp = text.indexOf(' ', a); if (sp > -1 && sp < i) a = sp + 1; }
  return (a ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, b)) + (b < text.length ? '…' : '');
}
function archiveHtml(){
  if (!LECT.length) return '<div class="list"><p class="empty">Tu trafią notatki z każdego wykładu, z podsumowaniem i pełną transkrypcją.</p></div>';
  const q = fold(FILTER.q.trim());
  const rows = LECT.filter(l => !FILTER.course || l.course === FILTER.course).map(l => {
    if (!q) return {l};
    const plain = t => String(t || '').replace(/^\s{0,3}#{1,4}\s*/gm, '').replace(/\*\*|__/g, '').replace(/^\s*[-*•–]\s+/gm, '').replace(/\s+/g, ' ').trim();
    const fields = [l.topic, l.course, plain(l.summary), plain(l.notes), showTr(transcriptText(l))];
    const hit = fields.find(x => fold(x).includes(q)); return hit === undefined ? null : {l, snip:snippet(String(hit), q)};
  }).filter(Boolean);
  const c = $('#acount'); if (c) c.textContent = rows.length === LECT.length ? LECT.length : rows.length + ' z ' + LECT.length;
  const quiz = FILTER.course ? '<button class="btn sec quiz-course" data-act="quiz" data-kind="course" data-c="' + esc(FILTER.course) + '">' + icon('cap') + 'Powtórka z przedmiotu</button>' : '';
  if (!rows.length) return quiz + '<div class="list"><p class="empty">Nic nie pasuje do wyszukiwania.</p></div>';
  return quiz + '<div class="list">' + rows.map(({l, snip}) => {
    const live = R && R.lecture.id === l.id, partial = l.status !== 'done' && !live;
    const meta = [l.topic ? esc(l.course) : '', esc(fmtShort(l.startedAt)), l.durationSec ? '<span class="num">' + fmtDur(l.durationSec) + '</span>' : '', live ? 'nagrywanie' : partial ? '<span class="state">niepełne</span>' : ''].filter(Boolean).join(' · ');
    return '<button class="entry" data-act="' + (live ? 'back-rec' : 'open') + '" data-id="' + esc(l.id) + '"><div class="entry-main"><div class="entry-title">' + (live ? '<i class="rec-dot" aria-hidden="true"></i>' : '') + '<span>' + esc(l.topic || l.course) + '</span></div><div class="entry-meta">' + meta + '</div>' + (snip ? '<div class="entry-snip">' + snip + '</div>' : '') + '</div>' + icon('next') + '</button>';
  }).join('') + '</div>';
}

/* live level trace */
const WAVE = []; let WAVE_COL = null;
function pushLevel(lv){ WAVE.push(lv); if (WAVE.length > 600) WAVE.shift(); drawWave(); }
function drawWave(){
  const c = $('#wave'); if (!c) return;
  const w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)){ c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  if (!WAVE_COL){ const cs = getComputedStyle(c); WAVE_COL = {base:cs.getPropertyValue('--wave').trim() || '#999', hot:cs.getPropertyValue('--rec').trim() || '#b42318'}; }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  const bw = 3, gap = 2, n = Math.floor((w + gap) / (bw + gap)), per = 2, mid = h / 2;
  for (let i = 0; i < n; i++){
    const end = WAVE.length - (n - 1 - i) * per; if (end <= 0) continue;
    let v = 0; for (let k = Math.max(0, end - per); k < end; k++) v = Math.max(v, WAVE[k]);
    const bh = Math.max(2, Math.round(v * (h - 4)));
    x.fillStyle = i === n - 1 && !(R && R.paused) ? WAVE_COL.hot : WAVE_COL.base;
    const px = i * (bw + gap), py = Math.round(mid - bh / 2);
    if (x.roundRect){ x.beginPath(); x.roundRect(px, py, bw, bh, 1.5); x.fill(); } else x.fillRect(px, py, bw, bh);
  }
}
window.addEventListener('resize', () => { WAVE_COL = null; drawWave(); });

  return {title:c, sub:'Powtórka z przedmiotu', store:cc, back:{act:'home'}, save:() => saveCfg()};
}
function vQuiz(arg){
  const T = quizTarget(arg); if (!T) return vHome();
  const q = T.store.quiz, backBtn = '<button class="back" data-act="' + T.back.act + '"' + (T.back.id ? ' data-id="' + esc(T.back.id) + '"' : '') + '>' + icon('back') + 'Wróć</button>';
  const body = q && q.items.length
    ? '<div class="qlist">' + q.items.map((it, i) => '<details class="qcard"><summary><span class="qn">' + (i + 1) + '</span><span>' + esc(it.q) + '</span></summary><div class="qa">' + esc(it.a) + '</div></details>').join('') + '</div>' +
      '<p class="help">Stuknij pytanie, żeby zobaczyć odpowiedź. Pytania powstały tylko z notatek, więc mają te same ograniczenia co notatki.</p>' +
      '<div class="row-btns" style="margin-top:12px"><button class="btn sec sm" data-act="quizdocx">' + icon('download') + 'Word</button><button class="btn ghost sm" data-act="quizgen">' + icon('redo') + 'Nowe pytania</button></div>'
    : '<section class="panel notice"><p>Ułożę ' + (arg.kind === 'course' ? '15' : '10') + ' pytań z odpowiedziami na podstawie ' + (arg.kind === 'course' ? 'notatek ze wszystkich wykładów z tego przedmiotu' : 'notatek z tego wykładu') + '. Zużywa to trochę dziennego limitu notatek.</p><div class="row-btns"><button class="btn pri" data-act="quizgen">' + icon('cap') + 'Ułóż pytania</button></div></section>';
  return '<header class="top">' + backBtn + '</header><div class="eyebrow">' + esc(T.sub) + '</div><h1 class="page-title" style="margin-top:4px">' + esc(T.title) + '</h1>' + body + '<div id="msg" class="mute" style="margin-top:12px"></div>';
}
const SYS_QUIZ = `Na podstawie notatek z wykładu ułóż pytania do powtórki przed egzaminem. Korzystaj wyłącznie z notatek: nie dodawaj faktów spoza nich. Pytania mają sprawdzać zrozumienie najważniejszych tez, definicji, podziałów i przykładów; punkty oznaczone „Ważne:” uwzględnij w pierwszej kolejności. Odpowiedź ma mieć 1–3 zdania i wynikać wprost z notatek. Pisz po polsku. Zwróć wyłącznie JSON w postaci {"items":[{"q":"pytanie","a":"odpowiedź"}]}, bez żadnego innego tekstu.`;
async function makeQuiz(arg){
  const T = quizTarget(arg), msg = $('#msg') || {};
  const n = arg.kind === 'course' ? 15 : 10;
  let src;
  if (arg.kind === 'lecture') src = tidyNotes(T.store.notes || '');
  else src = LECT.filter(l => l.course === arg.course && l.notes).sort((a, b) => a.startedAt - b.startedAt).map(l => '## Wykład ' + fmtDate(l.startedAt) + (l.topic ? ': ' + l.topic : '') + '\n' + tidyNotes(l.notes).replace(/^##/gm, '###')).join('\n\n');
  if (!src.trim()){ msg.textContent = 'Brak notatek, z których można ułożyć pytania.'; return; }
  msg.className = 'mute'; msg.textContent = 'Układam pytania…';
  try {
    const out = await chat(SYS_QUIZ, 'Liczba pytań: ' + n + '\n\nNotatki:\n"""\n' + condenseNotes(src, 10000) + '\n"""', sec => { msg.textContent = 'Układam pytania… Czekam ' + sec + ' s na limit Groq'; });
    const a = out.indexOf('{'), b = out.lastIndexOf('}');
    const items = (JSON.parse(out.slice(a, b + 1)).items || []).filter(x => x && x.q && x.a).map(x => ({q:String(x.q).trim(), a:String(x.a).trim()})).slice(0, 20);
    if (!items.length) throw new Error('Model nie zwrócił pytań. Spróbuj jeszcze raz.');
    T.store.quiz = {at:Date.now(), items}; await T.save(); render();
  } catch (e){ const m = $('#msg'); if (m){ m.className = 'err'; m.textContent = 'Nie udało się: ' + (e instanceof SyntaxError ? 'odpowiedź modelu była nieczytelna. Spróbuj jeszcze raz.' : e.message); } }
}
function quizMd(arg){
  const T = quizTarget(arg), q = T.store.quiz;
  return '# Powtórka: ' + T.title + '\n\n*' + T.sub + '*\n\n' + q.items.map((it, i) => '## ' + (i + 1) + '. ' + it.q + '\n' + it.a).join('\n\n');
}

function vSettings(){
  return '<header class="top"><button class="back" data-act="home">' + icon('back') + 'Wróć</button></header><h1 class="page-title">Ustawienia</h1>' +
    '<section class="panel"><h2 class="panel-title">Klucz API</h2><p class="help" style="margin-top:0">Domyślnie Groq: jeden klucz do transkrypcji i notatek, tworzony na console.groq.com/keys. Klucz zostaje tylko w tej przeglądarce i jest wysyłany wyłącznie pod adres poniżej.</p>' +
    '<label class="lbl" for="sttKey">Klucz</label><input id="sttKey" type="password" value="' + esc(CFG.sttKey) + '" placeholder="gsk_…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<label class="lbl" for="sttBase">Adres API</label><input id="sttBase" value="' + esc(CFG.sttBase) + '" autocapitalize="off" spellcheck="false" inputmode="url">' +
    '<div class="row-btns" style="margin-top:20px"><button class="btn pri" data-act="test">Zapisz i sprawdź</button></div><div id="testmsg" class="mute" style="margin-top:12px"></div></section>' +
    '<section class="panel"><h2 class="panel-title">Notatki i transkrypcja</h2>' +
    '<label class="lbl" for="sttModel">Model transkrypcji</label><input id="sttModel" list="sttList" value="' + esc(CFG.sttModel) + '" autocapitalize="off" spellcheck="false"><datalist id="sttList"></datalist>' +
    '<label class="lbl" for="llmModel">Model notatek</label><input id="llmModel" list="llmList" value="' + esc(CFG.llmModel) + '" autocapitalize="off" spellcheck="false"><datalist id="llmList"></datalist>' +
    '<label class="lbl" for="every">Nowe notatki co</label><select id="every">' + [2, 3, 4, 5].map(n => '<option value="' + n + '"' + (CFG.notesEveryMin === n ? ' selected' : '') + '>' + n + ' min</option>').join('') + '</select>' +
    '<label class="lbl" for="amode">Format dźwięku</label><select id="amode"><option value="auto"' + (CFG.audioMode === 'auto' ? ' selected' : '') + '>Automatyczny</option><option value="mr"' + (CFG.audioMode === 'mr' ? ' selected' : '') + '>Skompresowany, mniej danych</option><option value="wav"' + (CFG.audioMode === 'wav' ? ' selected' : '') + '>WAV, awaryjny (ok. 2 MB na minutę)</option></select>' +
    '<details style="margin-top:12px"><summary>' + icon('next') + 'Inny dostawca do notatek</summary><label class="check"><input type="checkbox" id="llmSame"' + (CFG.llmSame ? ' checked' : '') + '>Ten sam klucz i adres co transkrypcja</label><label class="lbl" for="llmBase">Adres API zgodny z OpenAI</label><input id="llmBase" value="' + esc(CFG.llmBase) + '" placeholder="https://openrouter.ai/api/v1" autocapitalize="off" spellcheck="false"><label class="lbl" for="llmKey">Klucz</label><input id="llmKey" type="password" value="' + esc(CFG.llmKey) + '" autocomplete="off" autocapitalize="off" spellcheck="false"></details>' +
    '<div class="row-btns" style="margin-top:20px"><button class="btn sec" data-act="savecfg">Zapisz</button></div></section>' +
    '<section class="panel"><h2 class="panel-title">Kopia archiwum</h2><p class="help" style="margin-top:0">Notatki są zapisane w pamięci tej przeglądarki. Safari może ją wyczyścić, jeśli długo nie otwierasz strony, więc ważne wykłady pobieraj od razu, a co jakiś czas zrób kopię. Aplikacja przypomni o niej po tygodniu.</p><div class="row-btns" style="margin-top:16px"><button class="btn sec sm" data-act="export">' + icon('download') + 'Pobierz kopię</button><button class="btn sec sm" data-act="import">Wczytaj kopię</button><input type="file" id="impf" accept="application/json,.json" hidden></div></section>';
}

function readSettingsForm(){
  const v = id => { const e = $('#' + id); return e ? e.value.trim() : null; };
  if (v('sttKey') !== null) CFG.sttKey = v('sttKey'); if (v('sttBase')) CFG.sttBase = v('sttBase').replace(/\/+$/, '');
  if (v('sttModel')) CFG.sttModel = v('sttModel'); if (v('llmModel')) CFG.llmModel = v('llmModel');
  if ($('#every')) CFG.notesEveryMin = parseInt($('#every').value, 10) || 3; if ($('#amode')) CFG.audioMode = $('#amode').value;
  if ($('#llmSame')) CFG.llmSame = $('#llmSame').checked; if (v('llmBase') !== null) CFG.llmBase = v('llmBase').replace(/\/+$/, ''); if (v('llmKey') !== null) CFG.llmKey = v('llmKey');
  if (CFG.audioMode !== 'auto') CFG.autoWav = false;
  saveCfg();
}
async function testConn(){
  readSettingsForm(); const m = $('#testmsg'); m.className = 'mute'; m.textContent = 'Sprawdzam…';
  try {
    const j = await api(CFG.sttBase, CFG.sttKey, '/models'); const ids = (j.data || []).map(x => x.id).sort();
    const stt = ids.filter(i => /whisper|transcri/i.test(i)), llm = ids.filter(i => !/whisper|transcri|tts|guard|embed|speech|orpheus|playai/i.test(i));
    $('#sttList').innerHTML = stt.map(i => '<option value="' + esc(i) + '">').join(''); $('#llmList').innerHTML = llm.map(i => '<option value="' + esc(i) + '">').join('');
    const warn = []; if (ids.length && !ids.includes(CFG.sttModel)) warn.push('modelu transkrypcji „' + CFG.sttModel + '” nie ma na liście'); if (CFG.llmSame && ids.length && !ids.includes(CFG.llmModel)) warn.push('modelu notatek „' + CFG.llmModel + '” nie ma na liście');
    CFG.keyOk = true; saveCfg(); m.className = warn.length ? 'err' : 'okc'; m.textContent = warn.length ? 'Klucz działa, ale ' + warn.join(' i ') + '. Wybierz inny z podpowiedzi.' : 'Działa. Klucz i modele są w porządku.';
  } catch (e){ CFG.keyOk = false; saveCfg(); m.className = 'err'; m.textContent = e.status === 401 ? 'Klucz jest nieprawidłowy.' : e.message; }
}
async function finishLecture(L, redo){
  const msg = $('#msg') || {}; if (R){ toast('Najpierw zakończ bieżące nagranie.'); return; }
  if (redo){ L.notes = ''; L.summary = ''; L.notedChars = 0; L.topic = ''; }
  L.status = 'interrupted'; L.summaryErr = ''; await DB.put(L);
  R = {lecture:L, queue:[], done:0, skipped:0, failed:0, netErr:'', notesErr:'', lastNotesAt:0, virtual:true};
  try {
    const full = transcriptText(L);
    while ((L.notedChars || 0) < full.length && !R.notesErrFatal){
      const before = L.notedChars || 0; msg.textContent = 'Piszę notatki… ' + Math.round(before / Math.max(1, full.length) * 100) + '%';
      const rest = full.slice(before); let take = rest.slice(0, 6000);
      if (rest.length > 6000){ const cut = Math.max(take.lastIndexOf('. '), take.lastIndexOf('? '), take.lastIndexOf('! ')); if (cut > 3000) take = take.slice(0, cut + 1); }
      const user = notesUser(L, take);
      const pct = Math.round(before / Math.max(1, full.length) * 100);
      const add = await chat(SYS_NOTES, user, sec => { msg.textContent = 'Piszę notatki… ' + pct + '%. Czekam ' + sec + ' s na limit Groq'; });
      L.notedChars = before + take.length; if (add && !/^BRAK\.?$/i.test(add.trim())) L.notes = (L.notes ? L.notes + '\n\n' : '') + add.trim();
      await DB.put(L);
    }
    msg.textContent = 'Robię podsumowanie…'; L.summaryErr = ''; await summarize(L);
    if (!L.endedAt){ L.endedAt = L.startedAt + ((L.transcript.slice(-1)[0] || {}).t || 0) * 1000; L.durationSec = Math.round((L.endedAt - L.startedAt) / 1000); }
    L.status = 'done'; await DB.put(L); R = null; render(); toast('Gotowe');
  } catch (e){ R = null; render(); const m2 = $('#msg'); if (m2){ m2.className = 'err'; m2.textContent = 'Nie udało się: ' + e.message; } }
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act, L = b.dataset.id && LECT.find(l => l.id === b.dataset.id);
  if (act === 'settings') go('settings');
  else if (act === 'home') go('home');
  else if (act === 'back-rec') go('rec');
  else if (act === 'start'){ b.disabled = true; await startRecording($('#course').value, ($('#hints') || {}).value); b.disabled = false; }
  else if (act === 'stop') stopRecording();
  else if (act === 'pause') pauseRecording();
  else if (act === 'resume') resumeRecording();
  else if (act === 'mark') markImportant();
  else if (act === 'edit' && L) go('edit', L.id);
  else if (act === 'saveedit' && L){
    L.topic = $('#e-topic').value.trim(); L.summary = $('#e-sum').value.trim(); L.notes = $('#e-notes').value.trim(); L.edited = Date.now();
    await DB.put(L); go('lecture', L.id); toast('Zapisane');
  }
  else if (act === 'quiz') go('quiz', b.dataset.kind === 'course' ? {kind:'course', course:b.dataset.c} : {kind:'lecture', id:b.dataset.id});
  else if (act === 'quizgen'){ b.disabled = true; await makeQuiz(VIEW.arg); b.disabled = false; }
  else if (act === 'quizdocx'){ const T = quizTarget(VIEW.arg); saveFile(buildDocx(quizMd(VIEW.arg)), ('Powtórka - ' + T.title).replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 80) + '.docx'); }
  else if (act === 'fcourse'){ FILTER.course = b.dataset.c; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.c === FILTER.course)); $('#arch').innerHTML = archiveHtml(); }
  else if (act === 'snooze'){ CFG.backupSnooze = Date.now() + 3 * 86400000; saveCfg(); render(); }
  else if (act === 'skipq'){ if (R) R.dropQueue = true; }
  else if (act === 'blackout') $('#blackout').classList.add('on');
  else if (act === 'tab'){ R.tab = b.dataset.tab; $('#notes').hidden = R.tab !== 'notes'; $('#tr').hidden = R.tab !== 'tr'; document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x.dataset.tab === R.tab)); }
  else if (act === 'open') go('lecture', b.dataset.id);
  else if (act === 'share' && L) shareLecture(L);
  else if (act === 'docx' && L) saveFile(buildDocx(lectureMd(L)), fileBase(L) + '.docx');
  else if (act === 'copy' && L){ try { await navigator.clipboard.writeText(mdPlain(lectureMd(L))); toast('Skopiowane'); } catch { toast('Nie udało się skopiować'); } }
  else if (act === 'del' && L){ if (confirm('Usunąć ten wykład z archiwum?')){ LECT = LECT.filter(l => l.id !== L.id); await DB.del(L.id); go('home'); } }
  else if (act === 'finish' && L) finishLecture(L, false);
  else if (act === 'redo' && L){ if (confirm('Napisać notatki od nowa z zapisanej transkrypcji?')) finishLecture(L, true); }
  else if (act === 'test') testConn();
  else if (act === 'savecfg'){ readSettingsForm(); toast('Zapisane'); }
  else if (act === 'export'){
    const ok = await saveFile(new Blob([JSON.stringify({app:'slucham', v:1, lectures:LECT, courses:CFG.courses})], {type:'application/json'}), 'slucham-archiwum-' + new Date().toISOString().slice(0, 10) + '.json');
    if (ok){ CFG.lastBackupAt = Date.now(); CFG.backupSnooze = 0; saveCfg(); if (VIEW.name === 'home') render(); }
  }
  else if (act === 'import') $('#impf').click();
});
document.addEventListener('change', async ev => {
  if (ev.target.id === 'impf' && ev.target.files[0]){
    try { const j = JSON.parse(await ev.target.files[0].text()); let n = 0; for (const l of (j.lectures || [])){ if (l && l.id && !LECT.some(x => x.id === l.id)){ LECT.push(l); await DB.put(l); n++; } } if (j.courses && typeof j.courses === 'object'){ for (const [k, v] of Object.entries(j.courses)) CFG.courses[k] = Object.assign({}, v, CFG.courses[k] || {}); saveCfg(); } sortLect(); toast('Wczytano wykładów: ' + n); }
    catch { toast('To nie jest plik kopii archiwum.'); }
  }
  if (ev.target.id === 'course'){ const h = $('#hints'); if (h) h.value = (CFG.courses[ev.target.value.trim()] || {}).hints || ''; }
});
document.addEventListener('input', ev => { if (ev.target.id === 'q'){ FILTER.q = ev.target.value; const a = $('#arch'); if (a) a.innerHTML = archiveHtml(); } });
$('#blackout').addEventListener('click', () => $('#blackout').classList.remove('on'));

/* ================= updates ================= */
const APP_VERSION = '2026-11-27.11';
async function checkUpdate(){
  if (R) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const v = String((await r.json()).version || '');
    if (!v || v === APP_VERSION || R) return;
    const seen = sessionStorage.getItem('slucham_upd');
    if (seen === v) return;
    sessionStorage.setItem('slucham_upd', v);
    location.replace(location.pathname + '?v=' + encodeURIComponent(v) + location.hash);
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !R){ checkUpdate(); recoverPending(); } });

/* ================= boot ================= */
(async () => {
  await DB.open(); LECT = await DB.all(); sortLect();
  for (const l of LECT){
    if (l.status === 'recording'){ l.status = 'interrupted'; DB.put(l); }
    else if (l.status === 'done' && transcriptText(l).length - (l.notedChars || 0) > 200){ l.status = 'interrupted'; DB.put(l); }
  }
  render();
  checkUpdate();
  recoverPending();
})();
window.__slucham = {buildDocx, mdBlocks, mdHtml, cleanText, encodeWav, downTo16k, lectureMd, mdPlain, zipStore, crc32};
