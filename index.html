<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="słuch'am">
<meta name="application-name" content="słuch'am">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>słuch'am</title>
<style>
:root{
  --bg:#f7f4ee; --card:#fdfbf7; --raised:#efe9df;
  --ink:#1f1b16; --ink2:#5e554a; --ink3:#7b7266;
  --line:rgba(31,27,22,.09); --wave:rgba(31,27,22,.28);
  --rec:#b42318; --rec-ink:#b42318; --ok:#16a34a; --warn:#9a5b0b; --danger:#b42318;
  --pri-bg:#1f1b16; --pri-ink:#fdfbf7; --seg-on:#fdfbf7;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141415; --card:#19191b; --raised:#232325;
    --ink:#ededed; --ink2:#a1a1a6; --ink3:#85858b;
    --line:rgba(237,237,237,.08); --wave:rgba(237,237,237,.26);
    --rec-ink:#e5484d; --ok:#4cc38a; --warn:#e0a458; --danger:#e5484d;
    --pri-bg:#ededed; --pri-ink:#141415; --seg-on:#323235;
  }
}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink3);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;min-height:56px;margin-bottom:8px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:17px;line-height:1;font-weight:600}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--rec);flex:none}
.icon-btn{width:44px;height:44px;margin-right:-12px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink2);transition:background-color .16s var(--ease)}
.icon-btn:hover{background:var(--raised)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-left:-8px;padding:0 8px;border-radius:8px;color:var(--ink2);font-size:15px;transition:background-color .16s var(--ease)}
.back:hover{background:var(--raised)}
.page-title{font:500 28px/1.15 var(--serif);margin:8px 0 20px}

/* surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 12px}
.panel-title{font-size:16px;line-height:24px;font-weight:500;margin:0 0 4px}
.lbl{display:block;font-size:13px;line-height:20px;color:var(--ink2);margin:16px 0 8px}
.lbl.first{margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid transparent;border-radius:10px;padding:12px;min-height:48px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .16s var(--ease),background-color .16s var(--ease)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--ink3);background-color:var(--card)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
textarea{min-height:88px;resize:vertical;line-height:1.45}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--pri-bg);-webkit-appearance:checkbox;appearance:auto}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:var(--ink2)}
details>summary::-webkit-details-marker{display:none}
details>summary .ic{width:16px;height:16px;transition:transform .16s var(--ease)}
details[open]>summary .ic{transform:rotate(90deg)}
.hints{margin-top:8px}
.help{font-size:13px;line-height:20px;color:var(--ink3);margin:12px 0 0}
.mute{font-size:13px;line-height:20px;color:var(--ink3)}
.okc{font-size:13px;line-height:20px;color:var(--ok)}
.err{font-size:13px;line-height:20px;color:var(--danger)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font-size:15px;line-height:1;font-weight:500;white-space:nowrap;transition:background-color .16s var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri-bg);color:var(--pri-ink)}
.btn.sec{background:var(--raised);color:var(--ink)}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{background:var(--raised)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn .ic{width:16px;height:16px}
.btn-rec{width:100%;min-height:56px;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:12px;background:var(--rec);color:#fff;font-size:17px;line-height:1;font-weight:500;transition:transform .12s var(--ease),filter .16s var(--ease)}
.btn-rec:hover{filter:brightness(1.06)}
.btn-rec:active{transform:scale(.98)}
.btn-rec .w{width:12px;height:12px;border-radius:50%;background:#fff}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* archive */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:32px 4px 8px}
.sec-head h2{margin:0;font-size:15px;line-height:20px;font-weight:500}
.count{font:400 12px/16px var(--mono);color:var(--ink3)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.entry{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 16px 12px 20px;text-align:left;border-top:1px solid var(--line);transition:background-color .16s var(--ease)}
.entry:first-child{border-top:0}
.entry:hover,.entry:active{background:var(--raised)}
.entry-main{flex:1;min-width:0}
.entry-title{display:flex;align-items:center;gap:8px;font-size:16px;line-height:22px;font-weight:500}
.entry-title span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.entry-meta{font-size:13px;line-height:20px;color:var(--ink3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.entry-meta .num{font-variant-numeric:tabular-nums}
.entry-meta .state{color:var(--warn)}
.entry>.ic{width:16px;height:16px;color:var(--ink3)}
.empty{padding:24px 20px;font-size:14px;line-height:22px;color:var(--ink3)}

/* recording */
.rec-head{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;color:var(--ink2);min-width:0}
.rec-head b{font-weight:500;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rec-head .rec-dot{animation:live 2.4s ease-in-out infinite}
@keyframes live{50%{opacity:.35}}
.timer{font-size:48px;line-height:1.1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:12px 0 16px}
.wave{display:block;width:100%;height:48px}
.status{font:400 12px/18px var(--mono);color:var(--ink3);margin-top:12px;font-variant-numeric:tabular-nums}
.status .err{font-family:var(--sans);margin-top:4px}
.seg{display:flex;gap:4px;padding:4px;background:var(--raised);border-radius:12px;margin:20px 0 12px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:14px;line-height:1;font-weight:500;color:var(--ink2);transition:background-color .16s var(--ease),color .16s var(--ease)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:12px;padding:12px max(20px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:var(--bg);border-top:1px solid var(--line)}
.dock .btn{flex:1;max-width:300px;min-height:48px}
.finish{flex:1;text-align:center;font-size:14px;line-height:20px;color:var(--ink2);white-space:pre-line;padding:4px 0}
.finish .btn{margin-top:8px}

/* notes */
.md{font-size:16px;line-height:1.55}
.md h1,.md h2{font-size:18px;line-height:26px;font-weight:500;margin:24px 0 8px}
.md h3{font-size:16px;line-height:24px;font-weight:500;margin:16px 0 4px}
.md>:first-child{margin-top:0}
.md p{margin:8px 0}
.md b{font-weight:600}
.md .li{position:relative;padding-left:16px;margin:4px 0}
.md .li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.md .li.l1{margin-left:16px}
.md .li.l1::before{background:none;border:1px solid var(--ink3);width:3px;height:3px}
.md .li.l2{margin-left:32px}
.md .ol{margin:4px 0;font-variant-numeric:tabular-nums}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md .placeholder{color:var(--ink3);font-size:15px;margin:0}
.tr{font-size:14px;line-height:22px;color:var(--ink2);white-space:pre-wrap}

/* lecture page */
.paper{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px 28px;margin:0 0 12px}
.eyebrow{font-size:14px;line-height:20px;color:var(--ink2)}
.doc-title{font:500 28px/1.15 var(--serif);margin:4px 0 8px;overflow-wrap:anywhere}
.doc-meta{font:400 12px/16px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.doc-actions .btn{flex:1 1 0;padding:0 12px}
.doc-actions .btn.pri{flex-basis:100%}
.summary{background:var(--raised);border-radius:12px;padding:16px;margin:24px 0}
.summary.md h1,.summary.md h2{font-size:14px;line-height:20px;color:var(--ink2);margin:16px 0 4px}
.summary.md>:first-child{margin-top:0}
.summary.md .li::before{background:var(--ink2)}
.paper>.md{margin-top:24px}
.notice{display:flex;flex-direction:column;gap:12px}
.notice p{margin:0;font-size:14px;line-height:22px;color:var(--ink2)}
.quiet{display:flex;gap:4px;flex-wrap:wrap;margin:4px -8px 0}
#msg{margin-top:8px}

/* recording extras */
.rec-head.paused .rec-dot{animation:none;opacity:.35}
.btn.mark{width:100%;margin-top:16px}
.btn.pri-soft{background:var(--pri-bg);color:var(--pri-ink)}
.md .li.imp::before{background:var(--rec);width:6px;height:6px;top:10px;left:1px}
.md .li.imp b:first-child{color:var(--rec-ink)}
.gap-note{margin-top:8px;font-size:13px;line-height:20px;color:var(--warn)}
.btn.wide{width:100%;margin:0 0 12px}
.edit-area{min-height:50vh;font-size:15px;line-height:1.5}
.edit-area.short{min-height:120px}
.panel.notice.tight{gap:12px}

/* archive tools */
.arch-tools{margin:0 0 12px}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px;border-radius:10px;background:var(--raised);color:var(--ink3)}
.search input{background:transparent;border:0;padding:0;min-height:44px}
.search input:focus{background:transparent;border:0}
.search input:focus-visible{outline:none}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--ink3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -20px 0;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:var(--raised);color:var(--ink2);font-size:14px;line-height:1;white-space:nowrap;transition:background-color .16s var(--ease),color .16s var(--ease)}
.chip.on{background:var(--pri-bg);color:var(--pri-ink)}
.entry-snip{margin-top:4px;font-size:13px;line-height:20px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-snip mark{background:var(--raised);color:var(--ink);border-radius:3px;padding:0 2px}
.btn.quiz-course{width:100%;margin:0 0 12px}

/* review questions */
.qlist{display:flex;flex-direction:column;gap:8px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 16px}
.qcard>summary{align-items:flex-start;gap:12px;min-height:0;padding:14px 0;font-size:15px;line-height:22px;color:var(--ink)}
.qn{flex:none;min-width:20px;font:400 12px/22px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.qa{padding:0 0 14px 32px;font-size:15px;line-height:22px;color:var(--ink2)}
.qcard[open]>summary{color:var(--ink)}

/* overlays */
#blackout{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0 24px calc(48px + env(safe-area-inset-bottom));background:#000;color:#3d3d3d;font-size:13px;line-height:20px;text-align:center}
#blackout.on{display:flex}
#blackout span{font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;max-width:calc(100% - 40px);transform:translate(-50%,8px);padding:10px 16px;border-radius:10px;background:var(--pri-bg);color:var(--pri-ink);font-size:14px;line-height:20px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* one entrance */
.view>*{animation:rise .36s var(--ease) both}
.view>*:nth-child(2){animation-delay:40ms}
.view>*:nth-child(3){animation-delay:80ms}
.view>*:nth-child(4){animation-delay:120ms}
.view>*:nth-child(5){animation-delay:160ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){
  .view>*,.rec-head .rec-dot{animation:none}
  *{transition-duration:0s!important}
}

.rec-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.linkish{background:none;border:0;padding:0;font:inherit;cursor:pointer;text-align:left}
.linkish:hover{color:var(--ink)}
.mini-h{font-size:13px;line-height:18px;color:var(--ink3);margin:0 0 8px}
.events{margin:20px 0 4px;padding:12px 0 0;border-top:1px solid var(--line)}
.ev{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .ev{padding:12px 16px;background:var(--card)}
.ev:last-child{border-bottom:0}
.ev-when{flex:0 0 76px;font:500 13px/18px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.ev-when span{display:block;font:400 12px/16px var(--sans);color:var(--ink3)}
.ev-when.nodate{color:var(--ink3);font-weight:400}
.ev-main{flex:1;min-width:0}
.ev-text{font-size:15px;line-height:22px;color:var(--ink)}
.ev-sub{font-size:13px;line-height:18px;color:var(--ink3)}
.icon-btn.sm{width:36px;height:36px}
.laws{margin-top:24px;padding-top:12px;border-top:1px solid var(--line)}
.law-chips{display:flex;flex-wrap:wrap;gap:6px}
.law{font:13px/18px var(--mono);color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.law i{font-style:normal;color:var(--ink3)}
.ask{margin-top:16px}
.ask .lbl{display:flex;align-items:center;gap:8px}
.ask-row{display:flex;gap:8px}
.ask-row input{flex:1;min-width:0}
.ask-out:empty{display:none}
.ask-out{margin-top:12px;font-size:15px;line-height:23px}
.ask-out.mute{color:var(--ink3)}
.tlist{display:flex;flex-direction:column}
.tseg{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px;margin:0 -8px;font:inherit;color:var(--ink2);font-size:15px;line-height:23px}
button.tseg{cursor:pointer}
button.tseg:hover{background:var(--raised)}
.tseg.playing{background:var(--raised);color:var(--ink);box-shadow:inset 2px 0 0 var(--rec)}
.tseg .tt,.tphoto .tt{flex:0 0 44px;font:12px/23px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.tseg .tx{flex:1;min-width:0}
.tphoto{display:flex;gap:12px;align-items:flex-start;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left}
.tphoto img{max-width:min(240px,60vw);border-radius:8px;border:1px solid var(--line);display:block}
.photo-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.photo-strip .tphoto{flex:0 0 auto;flex-direction:column;gap:4px;padding:0}
.photo-strip .tphoto img{height:112px;width:auto;max-width:none}
#viewer{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#viewer[hidden]{display:none}
#viewer img{max-width:100%;max-height:100%;border-radius:6px}
#viewer .icon-btn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;color:#fff;background:rgba(255,255,255,.12)}
#player{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
#player[hidden]{display:none}
.pl-main{flex:1;min-width:0}
.pl-t{font:500 13px/18px var(--mono);color:var(--ink)}
.pl-x{font-size:13px;line-height:18px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.has-player #app{padding-bottom:96px}
.course-title{margin-top:4px}
.course-meta{margin:-12px 0 16px}
.course-actions{margin:0 0 4px}
.course-box{margin-top:24px}
.terms{display:flex;flex-direction:column;gap:12px}
.term b{font-weight:500;color:var(--ink);font-size:15px}
.def{font-size:15px;line-height:22px;color:var(--ink2);margin-top:2px}
.def .when{font:12px var(--mono);color:var(--ink3)}
.study{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:8px}
.study-q{font-size:19px;line-height:27px;color:var(--ink);margin:4px 0 20px}
.study-a{font-size:16px;line-height:24px;color:var(--ink2);padding:16px 0 20px;border-top:1px solid var(--line)}
.study-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.top-btns{display:flex;gap:4px}
.icon-btn.flip svg{transform:scaleX(-1)}
.sec-head .btn.ghost.sm{margin-left:auto;padding:0 8px;min-height:32px}
.ev{gap:4px}
.ev-hit{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;color:inherit}
.cal-title{margin-bottom:12px}
.cal{padding:12px 12px 8px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-month{font:500 17px/24px var(--sans);color:var(--ink);text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-w{font-size:12px;line-height:24px;text-align:center;color:var(--ink3)}
.cal-d{position:relative;height:44px;border:0;border-radius:10px;background:none;font:400 15px/20px var(--sans);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums}
.cal-d.out{color:var(--ink3);opacity:.55}

.cal-d.sel{background:var(--pri-bg);color:var(--pri-ink)}

.cal-d i{display:flex;gap:3px;height:4px}
.cal-d i b{width:4px;height:4px;border-radius:50%;background:var(--ink2)}
.cal-today{display:block;margin:6px auto 0}
.cal-empty{margin:0 0 12px}
.ev-dt{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.ev-src{margin-bottom:12px}
.ev-src .linkish{color:var(--ink);font-size:15px;line-height:22px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.imp-open{margin-top:8px}
.imp-lead{margin:-8px 0 16px}
.imp-thumbs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.imp-thumb{position:relative}
.imp-thumb img{height:96px;border-radius:8px;border:1px solid var(--line);display:block}
.imp-thumb .icon-btn{position:absolute;top:4px;right:4px;width:28px;height:28px;background:var(--card)}
.imp-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.imp-row{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.imp-row.off{opacity:.55}
.imp-check{padding-top:10px}
.imp-check input{width:22px;height:22px;min-height:0;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--pri-bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.imp-main{flex:1;min-width:0}
.imp-main input{min-height:40px;padding:8px 10px}
.imp-text{font-weight:500}
.imp-course{font-size:13px;line-height:18px;color:var(--ink3);margin:4px 0 6px}
.imp-dt{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.imp-dt input,.ev-dt input{min-width:0;width:100%}
.imp-note{font-size:13px;line-height:18px;color:var(--ink2);margin-top:8px}
.imp-warn{font-size:13px;line-height:18px;color:var(--warn);margin-top:6px}

body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:45;pointer-events:none}
.cal-d.has span{font-weight:600}
.cal-d i{height:6px;gap:3px}
.cal-d i b{width:6px;height:6px}
.cal-d i b.exam,.cal-legend b.exam{background:var(--rec)}
.cal-d i b.test,.cal-legend b.test{background:var(--warn)}
.cal-d i b.other,.cal-legend b.other{background:var(--ink3)}
.cal-d.sel i b{box-shadow:0 0 0 1.5px var(--pri-bg)}
.cal-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 6px 4px;font-size:12px;line-height:16px;color:var(--ink3)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend b{width:8px;height:8px;border-radius:50%;display:inline-block}
.cal-legend .cal-today{margin:0 0 0 auto}
.ev.exam .ev-when,.ev.test .ev-when{position:relative;padding-left:12px}
.ev.exam .ev-when::before,.ev.test .ev-when::before{content:'';position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.ev.exam .ev-when::before{background:var(--rec)}

<script>
'use strict';
/* ================= helpers ================= */

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function dbg(){ try { return JSON.parse(localStorage.getItem('slucham_debug') || '{}'); } catch { return {}; } }

/* ================= settings ================= */
const DEF = {
  sttBase:'https://api.groq.com/openai/v1', sttKey:'', sttModel:'whisper-large-v3',
  llmSame:true, llmBase:'', llmKey:'', llmModel:'openai/gpt-oss-120b',

if (!CFG.migr5){ if (CFG.notesEveryMin === 3) CFG.notesEveryMin = 5; CFG.migr5 = true; try { localStorage.setItem('slucham_cfg', JSON.stringify(CFG)); } catch {} }
function saveCfg(){ try { localStorage.setItem('slucham_cfg', JSON.stringify(CFG)); } catch {} }

/* ================= storage (IndexedDB, memory fallback) ================= */
const DB = {
  db:null, mem:new Map(),
  open(){ return new Promise(res => { try { const rq = indexedDB.open('slucham', 3);
    rq.onupgradeneeded = () => { const d = rq.result;
      if (!d.objectStoreNames.contains('lectures')) d.createObjectStore('lectures', {keyPath:'id'});
      if (!d.objectStoreNames.contains('segments')) d.createObjectStore('segments', {keyPath:'key'});
      if (!d.objectStoreNames.contains('audio')) d.createObjectStore('audio', {keyPath:'key'}).createIndex('lid', 'lid');
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', {keyPath:'key'}).createIndex('lid', 'lid');
    };
    rq.onsuccess = () => { this.db = rq.result; res(); }; rq.onerror = () => res(); } catch { res(); } }); },
  all(){ if (!this.db) return Promise.resolve([...this.mem.values()]);

  put(l){ this.mem.set(l.id, l); if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction('lectures', 'readwrite'); tx.objectStore('lectures').put(JSON.parse(JSON.stringify(l))); tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res(); } catch { res(); } }); },
  del(id){ this.mem.delete(id); if (!this.db) return Promise.resolve();

  // audio fragments not yet transcribed: kept on the phone until Groq has them
  segPut(r){ if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction('segments', 'readwrite'); tx.objectStore('segments').put(r); tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res(); } catch { res(); } }); },
  segDel(key){ if (!this.db || !key) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction('segments', 'readwrite'); tx.objectStore('segments').delete(key); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch { res(); } }); },
  get(store, key){ if (!this.db) return Promise.resolve(null);
    return new Promise(res => { try { const rq = this.db.transaction(store).objectStore(store).get(key); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); } catch { res(null); } }); },
  putIn(store, r){ if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction(store, 'readwrite'); tx.objectStore(store).put(r); tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res(); } catch { res(); } }); },
  byLid(store, lid){ if (!this.db) return Promise.resolve([]);
    return new Promise(res => { try { const rq = this.db.transaction(store).objectStore(store).index('lid').getAll(lid); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch { res([]); } }); },
  keysByLid(store, lid){ if (!this.db) return Promise.resolve([]);
    return new Promise(res => { try { const rq = this.db.transaction(store).objectStore(store).index('lid').getAllKeys(lid); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch { res([]); } }); },
  async delByLid(store, lid){ const keys = await this.keysByLid(store, lid); if (!this.db || !keys.length) return 0;
    return new Promise(res => { try { const tx = this.db.transaction(store, 'readwrite'); const os = tx.objectStore(store); keys.forEach(k => os.delete(k)); tx.oncomplete = () => res(keys.length); tx.onerror = () => res(0); } catch { res(0); } }); },
  // a transcribed fragment moves from the send queue to the lecture's recording
  segToAudio(key){ if (!this.db || !key) return Promise.resolve();
    return new Promise(res => { try { const tx = this.db.transaction(['segments', 'audio'], 'readwrite'); const sg = tx.objectStore('segments');
      const rq = sg.get(key); rq.onsuccess = () => { const r = rq.result; if (r){ tx.objectStore('audio').put({key:r.key, lid:r.lid, idx:r.idx, t0:r.t0, t1:r.t1, type:r.type, data:r.data}); sg.delete(key); } };
      tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res(); } catch { res(); } }); },
  segAll(){ if (!this.db) return Promise.resolve([]);
    return new Promise(res => { try { const rq = this.db.transaction('segments').objectStore('segments').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch { res([]); } }); }
};
let LECT = [];
const sortLect = () => LECT.sort((a, b) => b.startedAt - a.startedAt);
const transcriptText = L => (L.transcript || []).map(s => s.text).join(' ');

/* ================= API ================= */
function waitFromMsg(msg){
  const m = String(msg || '').match(/try again in\s*((?:\d+(?:\.\d+)?h)?(?:\d+(?:\.\d+)?m(?!s))?(?:\d+(?:\.\d+)?s)?(?:\d+(?:\.\d+)?ms)?)/i);
  if (!m || !m[1]) return 0;
  let t = 0; const g = (re, k) => { const x = m[1].match(re); if (x) t += parseFloat(x[1]) * k; };
  g(/(\d+(?:\.\d+)?)h/, 3600); g(/(\d+(?:\.\d+)?)m(?!s)/, 60); g(/(\d+(?:\.\d+)?)s/, 1); g(/(\d+(?:\.\d+)?)ms/, 0.001);
  return t;
}
async function api(base, key, path, opts = {}){
  let r;
  try { r = await fetch(String(base).replace(/\/+$/, '') + path, {...opts, headers:{Authorization:'Bearer ' + key, ...(opts.headers || {})}}); }
  catch { const e = new Error('Brak połączenia z API (sieć albo blokada w przeglądarce).'); e.net = true; throw e; }
  if (!r.ok){
    let msg = ''; try { const j = await r.json(); msg = (j.error && (j.error.message || j.error)) || JSON.stringify(j).slice(0, 200); } catch {}
    const e = new Error('Błąd API ' + r.status + (msg ? ': ' + String(msg).slice(0, 220) : '')); e.status = r.status; e.retryAfter = parseFloat(r.headers.get('retry-after')) || waitFromMsg(msg); e.daily = /per day|\(TPD\)|\(RPD\)|\(ASD\)/i.test(String(msg)); throw e;
  }

}
const llmConf = () => CFG.llmSame ? {base:CFG.sttBase, key:CFG.sttKey, model:CFG.llmModel} : {base:CFG.llmBase, key:CFG.llmKey, model:CFG.llmModel};
const TOK_WINDOW = [];
const estTokens = s => Math.ceil(s.length / 2.5) + 700;
async function paceTokens(need, onWait){
  const budget = (dbg().tpm || 7000);
  for (;;){
    const now = Date.now(); while (TOK_WINDOW.length && now - TOK_WINDOW[0].t > 60000) TOK_WINDOW.shift();
    const used = TOK_WINDOW.reduce((a, x) => a + x.n, 0);
    if (!TOK_WINDOW.length || used + need <= budget) return;
    const waitMs = 60000 - (now - TOK_WINDOW[0].t) + 250;
    onWait && onWait(Math.ceil(waitMs / 1000));
    await sleep(Math.min(waitMs, 5000));

}
const NOTE_CHAIN = {'openai/gpt-oss-120b':['openai/gpt-oss-20b', 'qwen/qwen3.8-27b']};
const chainFor = primary => [primary, ...(NOTE_CHAIN[primary] || [])];
function activeModel(primary){
  const ex = CFG.exhausted || {};
  return chainFor(primary).find(m => !(ex[m] && Date.now() < ex[m])) || primary;
}
function tuneBody(body){
  delete body.reasoning_effort;
  if (/gpt-oss/i.test(body.model)) body.reasoning_effort = 'low';
  else if (/qwen3/i.test(body.model)) body.reasoning_effort = 'none';
}
let WORKING = 0;
async function chat(system, user, onWait, opts){
  WORKING++;

}
async function chatInner(system, user, onWait, opts){

  const body = {model:imgs.length ? opts.model : activeModel(c.model), messages:[{role:'system', content:system}, {role:'user', content}], temperature:0.2};
  tuneBody(body);

  let tries = 0, j;
  for (;;){
    await paceTokens(need, onWait);
    const slot = {t:Date.now(), n:need}; TOK_WINDOW.push(slot);
    try {
      j = await api(c.base, c.key, '/chat/completions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (j.usage && j.usage.total_tokens) slot.n = j.usage.total_tokens;
      break;
    } catch (e){
      const i = TOK_WINDOW.indexOf(slot); if (i >= 0) TOK_WINDOW.splice(i, 1);
      if (e.status === 400 && (body.temperature !== undefined || body.reasoning_effort)){ delete body.temperature; delete body.reasoning_effort; continue; }
      if (imgs.length && (e.status === 400 || e.status === 404)){ e.message = 'Model ' + body.model + ' nie przyjął zrzutu ekranu (' + e.message + '). Wklej tekst zamiast zrzutu.'; throw e; }

      }

    }

}
let LAST_MODEL = '';

/* ================= transcription ================= */
const HALLU = [
  /napisy (stworzone|wykonane|przygotowane) przez[^.!?\n]{0,60}[.!?]?/gi, /amara\.org/gi,
  /dzi[eę]kuj[eę](my)? za (ogl[aą]danie|uwag[eę] i do zobaczenia)[.!]?/gi, /zapraszam(y)? do subskry\w+[^.!?\n]{0,40}[.!?]?/gi,
  /do zobaczenia w (kolejnym|nast[eę]pnym) (odcinku|filmie)[.!]?/gi, /zdj[eę]cia i monta[zż][^.!?\n]{0,40}[.!?]?/gi
];
function cleanText(t, prompt){
  t = String(t || '').replace(/\s+/g, ' ').trim();
  for (const re of HALLU) t = t.replace(re, ' ');
  t = t.replace(/((?:[\p{L}\d][\p{L}\d ,'-]{2,50}?[.!?,]?\s))\1{4,}/gu, '$1');
  t = t.replace(/\s+/g, ' ').trim();
  if (prompt && t && prompt.includes(t) && t.length > 20) return '';
  if (/^[\s.,!?…-]*$/.test(t)) return '';
  if (/^(dzi[eę]kuj[eę]\.?|tak\.?|no\.?|mhm\.?)$/i.test(t)) return '';

}
function encodeWav(int16, rate){
  const buf = new ArrayBuffer(44 + int16.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };

  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, int16.length * 2, true);

async function blobToWav(blob, ctx){

/* ================= recorder ================= */
class Rec {

async function transcribeSeg(seg, L, ctx){

      const wav = await blobToWav(seg.blob, ctx.rec && !ctx.rec.stopped ? ctx.rec.ctx : null);
      j = await send(wav, 'wav', false);

function backupDue(){
  if (!LECT.length) return null;
  const last = CFG.lastBackupAt || 0, oldest = Math.min(...LECT.map(l => l.startedAt));
  const since = last || oldest, fresh = LECT.some(l => l.startedAt > last && l.status !== 'recording');
  if (!fresh || Date.now() - since < 7 * 86400000 || (CFG.backupSnooze && Date.now() < CFG.backupSnooze)) return null;
  return last ? 'Ostatnia kopia archiwum: ' + Math.floor((Date.now() - last) / 86400000) + ' dni temu.' : 'Nie masz jeszcze kopii archiwum.';
}

function snippet(text, q){
  const f = fold(text), i = f.indexOf(q); if (i < 0) return '';
  let a = Math.max(0, i - 40), b = Math.min(text.length, i + q.length + 60);
  if (a > 0){ const sp = text.indexOf(' ', a); if (sp > -1 && sp < i) a = sp + 1; }
  return (a ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, b)) + (b < text.length ? '…' : '');
}
function archiveHtml(){
  if (!LECT.length) return '<div class="list"><p class="empty">Tu trafią notatki z każdego wykładu, z podsumowaniem i pełną transkrypcją.</p></div>';
  const q = fold(FILTER.q.trim());
  const rows = LECT.filter(l => !FILTER.course || l.course === FILTER.course).map(l => {
    if (!q) return {l};
    const plain = t => String(t || '').replace(/^\s{0,3}#{1,4}\s*/gm, '').replace(/\*\*|__/g, '').replace(/^\s*[-*•–]\s+/gm, '').replace(/\s+/g, ' ').trim();
    const fields = [l.topic, l.course, plain(l.summary), plain(l.notes), showTr(transcriptText(l))];
    const hit = fields.find(x => fold(x).includes(q)); return hit === undefined ? null : {l, snip:snippet(String(hit), q)};
  }).filter(Boolean);
  const c = $('#acount'); if (c) c.textContent = rows.length === LECT.length ? LECT.length : rows.length + ' z ' + LECT.length;
  const only = [...new Set(LECT.map(l => l.course))], fc = FILTER.course || (only.length === 1 && !FILTER.q.trim() ? only[0] : '');
  const quiz = fc ? '<button class="btn sec quiz-course" data-act="course" data-c="' + esc(fc) + '">' + icon('book') + 'Przedmiot: skrypt, słownik, powtórka</button>' : '';
  if (!rows.length) return quiz + '<div class="list"><p class="empty">Nic nie pasuje do wyszukiwania.</p></div>';
  return quiz + '<div class="list">' + rows.map(({l, snip}) => {
    const live = R && R.lecture.id === l.id, partial = l.status !== 'done' && !live;
    const meta = [l.topic ? esc(l.course) : '', esc(fmtShort(l.startedAt)), l.durationSec ? '<span class="num">' + fmtDur(l.durationSec) + '</span>' : '', live ? 'nagrywanie' : partial ? '<span class="state">niepełne</span>' : ''].filter(Boolean).join(' · ');
    return '<button class="entry" data-act="' + (live ? 'back-rec' : 'open') + '" data-id="' + esc(l.id) + '"><div class="entry-main"><div class="entry-title">' + (live ? '<i class="rec-dot" aria-hidden="true"></i>' : '') + '<span>' + esc(l.topic || l.course) + '</span></div><div class="entry-meta">' + meta + '</div>' + (snip ? '<div class="entry-snip">' + snip + '</div>' : '') + '</div>' + icon('next') + '</button>';
  }).join('') + '</div>';
}

/* live level trace */
const WAVE = []; let WAVE_COL = null;
function pushLevel(lv){ WAVE.push(lv); if (WAVE.length > 600) WAVE.shift(); drawWave(); }
function drawWave(){
  const c = $('#wave'); if (!c) return;
  const w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)){ c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  if (!WAVE_COL){ const cs = getComputedStyle(c); WAVE_COL = {base:cs.getPropertyValue('--wave').trim() || '#999', hot:cs.getPropertyValue('--rec').trim() || '#b42318'}; }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  const bw = 3, gap = 2, n = Math.floor((w + gap) / (bw + gap)), per = 2, mid = h / 2;
  for (let i = 0; i < n; i++){
    const end = WAVE.length - (n - 1 - i) * per; if (end <= 0) continue;
    let v = 0; for (let k = Math.max(0, end - per); k < end; k++) v = Math.max(v, WAVE[k]);
    const bh = Math.max(2, Math.round(v * (h - 4)));
    x.fillStyle = i === n - 1 && !(R && R.paused) ? WAVE_COL.hot : WAVE_COL.base;
    const px = i * (bw + gap), py = Math.round(mid - bh / 2);
    if (x.roundRect){ x.beginPath(); x.roundRect(px, py, bw, bh, 1.5); x.fill(); } else x.fillRect(px, py, bw, bh);
  }
}
window.addEventListener('resize', () => { WAVE_COL = null; drawWave(); });

function askPanel(kind, id, label, ph, ans){

function transcriptRows(L, hasAudio){
  const photos = (PHOTO_CACHE[L.id] || []).slice().sort((a, b) => a.t - b.t); let pi = 0;
  const rows = [];
  (L.transcript || []).forEach((x, i) => {
    while (pi < photos.length && photos[pi].t <= x.t) rows.push(photoRow(photos[pi++]));
    const playable = hasAudio && x.a;
    rows.push((playable ? '<button class="tseg" data-act="play" data-id="' + esc(L.id) + '" data-i="' + i + '">' : '<div class="tseg">') +
      '<span class="tt">' + fmtDur(x.t || 0) + '</span><span class="tx">' + esc(showTr(x.text)) + '</span>' + (playable ? '</button>' : '</div>'));
  });
  while (pi < photos.length) rows.push(photoRow(photos[pi++]));

const PLAYER = {el:null, lid:null, i:-1, url:null};
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function playerEl(){
  if (!PLAYER.el){
    PLAYER.el = new Audio(); PLAYER.el.preload = 'auto';
    PLAYER.el.addEventListener('ended', () => { if (PLAYER.lid && PLAYER.el.src.startsWith('blob:')) playEntry(PLAYER.lid, PLAYER.i + 1, true); });
    ['play', 'pause'].forEach(ev => PLAYER.el.addEventListener(ev, uiPlayer));
  }

}
async function playEntry(lid, i, auto){
  const el = playerEl(), L = LECT.find(l => l.id === lid);
  // iOS only lets audio start inside the tap: start a silent sound now, swap in the fragment after the read
  if (!auto){ try { el.src = SILENT; const pr = el.play(); if (pr) pr.catch(() => {}); } catch {} }
  while (L && i < L.transcript.length && !L.transcript[i].a) i++;
  if (!L || i >= L.transcript.length){ stopPlayer(); return; }
  const rec = await DB.get('audio', L.transcript[i].a);
  if (!rec){ toast('Tego fragmentu nagrania nie ma już w telefonie'); stopPlayer(); return; }
  if (PLAYER.url) URL.revokeObjectURL(PLAYER.url);
  PLAYER.url = URL.createObjectURL(new Blob([rec.data], {type:rec.type || 'audio/mp4'}));
  PLAYER.lid = lid; PLAYER.i = i; el.src = PLAYER.url;
  try { await el.play(); } catch { toast('Nie udało się odtworzyć nagrania'); }
  uiPlayer();
}
function stopPlayer(){ if (PLAYER.el){ try { PLAYER.el.pause(); } catch {} } PLAYER.lid = null; PLAYER.i = -1; uiPlayer(); }

/* ---------- laws, terms, subject script ---------- */
const CODE_RE = '(?:[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{1,6}\\.){2,6}|Konstytucji(?: RP)?|KRP|EKPCz?|TUE|TFUE';
const CODE_END = new RegExp('(' + CODE_RE + ')$');
function extractLaws(text){
  const re = new RegExp('\\bart(?:\\.|ykuł(?:u|em|y|ów)?)\\s*(\\d+[a-z]?)((?:\\s*(?:§|ust\\.|pkt|lit\\.)\\s*\\d+[a-z]?\\)?)*)(?:\\s+(' + CODE_RE + '))?', 'gi');
  const map = new Map(); let m;
  const clean = String(text || '').replace(/\*\*|__/g, '');
  while ((m = re.exec(clean))){
    const ref = ('art. ' + m[1] + (m[2] ? ' ' + m[2].replace(/\s+/g, ' ').trim() : '') + (m[3] ? ' ' + m[3] : '')).replace(/\s+/g, ' ').trim();
    const k = ref.toLowerCase(), cur = map.get(k);
    map.set(k, {ref:cur ? cur.ref : ref, n:(cur ? cur.n : 0) + 1});
  }
  return [...map.values()].sort((a, b) => {
    const ca = (a.ref.match(CODE_END) || [''])[0], cb = (b.ref.match(CODE_END) || [''])[0];
    return ca.localeCompare(cb, 'pl') || (parseInt(a.ref.slice(5)) - parseInt(b.ref.slice(5))) || a.ref.localeCompare(b.ref, 'pl');
  });
}
function extractTerms(lectures){
  const out = new Map();
  for (const L of lectures){
    for (const line of tidyNotes(L.notes || '').split('\n')){
      const m = line.match(/^\s*[-*•]\s+\*\*([^*]{2,80})\*\*\s*(?:[–—-]|:)\s*(.{4,})$/);
      if (!m || /^ważne:?$/i.test(m[1].trim())) continue;
      const term = m[1].trim().replace(/[:–-]+$/, '').trim(), k = fold(term);
      if (!out.has(k)) out.set(k, {term, defs:[]});
      else if (/^[a-ząćęłńóśźż]/.test(out.get(k).term) && /^[A-ZĄĆĘŁŃÓŚŹŻ]/.test(term)) out.get(k).term = term;
      out.get(k).defs.push({def:m[2].trim(), date:L.startedAt, lid:L.id});
    }
  }
  return [...out.values()].sort((a, b) => a.term.localeCompare(b.term, 'pl'));
}
const courseLectures = c => LECT.filter(l => l.course === c).sort((a, b) => a.startedAt - b.startedAt);
const dayOnly = t => new Date(t).toLocaleDateString('pl-PL', {day:'numeric', month:'short'});
function scriptMd(c){
  const ls = courseLectures(c).filter(l => l.notes || l.summary);
  const terms = extractTerms(ls), laws = extractLaws(ls.map(l => (l.summary || '') + '\n' + (l.notes || '')).join('\n'));
  const head = (l, i) => (i + 1) + '. ' + fmtDate(l.startedAt) + (l.topic ? ' — ' + l.topic : '');
  let md = '# ' + c + ' — skrypt z wykładów\n\n' + ls.length + ' ' + plural(ls.length, 'wykład', 'wykłady', 'wykładów') + (ls.length ? ', od ' + fmtDate(ls[0].startedAt) + ' do ' + fmtDate(ls[ls.length - 1].startedAt) : '') + '. Notatki zrobione automatycznie z nagrań – rzeczy ważne na egzamin sprawdzaj w transkrypcji.\n\n## Spis treści\n' +
    ls.map((l, i) => '- ' + head(l, i)).join('\n') + (terms.length ? '\n- Słownik pojęć' : '') + (laws.length ? '\n- Przywołane przepisy' : '') + '\n';
  ls.forEach((l, i) => {
    md += '\n<<<PB>>>\n# ' + head(l, i) + '\n\n' + fmtTime(l.startedAt) + (l.durationSec ? ' · ' + fmtDur(l.durationSec) : '') + '\n\n' + (l.summary ? l.summary + '\n\n---\n\n' : '') + (l.notes ? tidyNotes(l.notes) : '') + '\n';
  });
  if (terms.length) md += '\n<<<PB>>>\n# Słownik pojęć\n\n' + terms.map(t => '- **' + t.term + '** – ' + t.defs.map(d => d.def + ' (' + dayOnly(d.date) + ')').join('; ')).join('\n') + '\n';
  if (laws.length) md += '\n<<<PB>>>\n# Przywołane przepisy\n\n' + laws.map(x => '- ' + x.ref + (x.n > 1 ? ' (' + x.n + '×)' : '')).join('\n') + '\n';
  return md;
}
function lectureDocx(L){
  const photos = PHOTO_CACHE[L.id] || [], images = {};
  let md = lectureMd(L);
  if ((L.events || []).length) md += '\n\n## Terminy\n' + L.events.map(e => '- ' + (e.date || 'bez daty') + ': ' + e.text).join('\n');

    const a = out.indexOf('{'), b = out.lastIndexOf('}');

function quizMd(arg){

/* ================= calendar ================= */
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayYmd = () => ymd(new Date());
const evDate = s => new Date(s + 'T12:00:00');
const newEvId = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const MONTHS = ['styczeń', 'luty', 'marzec', 'kwiecień', 'maj', 'czerwiec', 'lipiec', 'sierpień', 'wrzesień', 'październik', 'listopad', 'grudzień'];
const WDAYS = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'So', 'Nd'];

// one line of an event from the model: "@termin 2027-01-15 10:00 | kolokwium" (notes) or "- 2027-01-15 | kolokwium" (summary)
function parseEvLine(line, needTag){
  const re = needTag
    ? /^\s*[-*•]?\s*@termin\s*:?\s*(\d{4}-\d{2}-\d{2}|bez daty)(?:\s*,?\s*(?:godz\.?\s*)?(\d{1,2})[:.](\d{2}))?\s*\|\s*(.+)$/i
    : /^\s*[-*•]\s*(?:@termin\s*:?\s*)?(\d{4}-\d{2}-\d{2}|bez daty)(?:\s*,?\s*(?:godz\.?\s*)?(\d{1,2})[:.](\d{2}))?\s*\|\s*(.+)$/i;
  const m = String(line).match(re); if (!m) return null;
  const text = m[4].replace(/[*_]+/g, '').trim(); if (text.length < 3) return null;
  const date = /^\d/.test(m[1]) ? m[1] : '';
  if (date && isNaN(evDate(date))) return null;
  const h = m[2] ? parseInt(m[2], 10) : -1;
  return {date, time:h >= 0 && h < 24 ? pad2(h) + ':' + m[3] : '', text:text.slice(0, 160)};
}
function splitEvents(add){
  const events = [], keep = [];
  for (const line of String(add || '').split('\n')){
    if (/@termin/i.test(line)){ const e = parseEvLine(line, true); if (e) events.push(e); continue; }
    keep.push(line);
  }
  return {notes:keep.join('\n').trim(), events};
}
const evWords = t => new Set(fold(t).split(/[^a-z0-9]+/).filter(w => w.length > 3));
function sameEvent(a, b){
  if ((a.date || '') !== (b.date || '')) return false;
  const A = evWords(a.text), B = evWords(b.text); if (!A.size || !B.size) return fold(a.text) === fold(b.text);
  let n = 0; A.forEach(w => { if (B.has(w)) n++; });
  return n / Math.min(A.size, B.size) >= 0.5;
}
// adds events found by the model to a lecture, skipping duplicates and ones the user deleted
function addAutoEvents(L, list){
  L.events = L.events || []; const added = [];
  for (const e of list){
    if ((L.dismissed || []).some(d => sameEvent(d, e))) continue;
    // an undated event that later gets a date: update it instead of adding a second one
    const same = L.events.find(x => sameEvent(x, e)) || (e.date ? L.events.find(x => !x.date && sameEvent({...x, date:e.date}, e)) : null);
    if (same){ if (!same.edited){ if (!same.date && e.date) same.date = e.date; if (!same.time && e.time) same.time = e.time; } continue; }
    const ev = {id:newEvId(), date:e.date, time:e.time || '', text:e.text, src:'auto'};
    L.events.push(ev); added.push(ev);
  }
  if (L.events.length > 30) L.events = L.events.slice(-30);
  return added;
}
function normalizeEvents(L){
  let ch = false;
  for (const e of (L.events || [])){ if (!e.id){ e.id = newEvId(); e.src = e.src || 'auto'; e.time = e.time || ''; ch = true; } }
  return ch;
}
function allEvents(){
  LECT.forEach(normalizeEvents);
  return [...LECT.flatMap(l => (l.events || []).map(e => ({...e, l, course:l.course}))), ...(CFG.events || []).map(e => ({...e}))];
}
function findEvent(id){
  for (const l of LECT){ const e = (l.events || []).find(x => x.id === id); if (e) return {e, L:l}; }
  const e = (CFG.events || []).find(x => x.id === id); return e ? {e, L:null} : null;
}
const evKind = e => /egzamin/i.test(e.text) ? 'exam' : /kolokw|test|sprawdzian|kartk|zaliczen/i.test(e.text) ? 'test' : 'other';
const evSort = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99');

/* ---------- file for the iPhone calendar ---------- */
function icsFile(e, L){
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const q = t => String(t).replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
  const d = e.date.replace(/-/g, ''), lines = [];
  if (e.time){
    const s = new Date(e.date + 'T' + e.time + ':00'), en = new Date(s.getTime() + 90 * 60000);
    const f = x => ymd(x).replace(/-/g, '') + 'T' + pad2(x.getHours()) + pad2(x.getMinutes()) + '00';
    lines.push('DTSTART:' + f(s), 'DTEND:' + f(en));
  } else {
    const n = evDate(e.date); n.setDate(n.getDate() + 1);
    lines.push('DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + ymd(n).replace(/-/g, ''));
  }
  const course = e.course || (L && L.course) || '';
  const desc = e.note || (L ? 'Zapowiedziane na wykładzie ' + fmtDate(L.startedAt) + '. Sprawdź w transkrypcji.' : '');
  const alarm = tr => ['BEGIN:VALARM', 'TRIGGER:' + tr, 'ACTION:DISPLAY', 'DESCRIPTION:' + q(e.text), 'END:VALARM'];
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//slucham//PL', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    'UID:' + e.id + '@slucham', 'DTSTAMP:' + stamp, ...lines,
    'SUMMARY:' + q((course ? course + ': ' : '') + e.text), ...(desc ? ['DESCRIPTION:' + q(desc)] : []),
    ...(e.time ? [...alarm('-PT1H'), ...alarm('-P1D')] : alarm('-PT15H')), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  return new Blob([body], {type:'text/calendar'});
}
function addToCalendar(id){
  const f = findEvent(id); if (!f || !f.e.date){ toast('Najpierw ustal dzień tego wydarzenia'); return; }
  const e = {...f.e, course:f.e.course || (f.L && f.L.course)};
  const blob = icsFile(e, f.L), name = ((e.course ? e.course + ' ' : '') + e.date).replace(/[\\/:*?"<>|]+/g, ' ') + '.ics';
  if (isIOS){ blob.text().then(t => { location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(t); }); return; }
  saveBlob(blob, name);
}

async function shrinkImage(file, max){

    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);

}

function importItems(list){

      const date = /^\d{4}-\d{2}-\d{2}$/.test(x.date || '') && !isNaN(evDate(x.date)) ? x.date : '';
      const time = /^\d{1,2}:\d{2}$/.test(x.time || '') ? x.time.padStart(5, '0') : '';
      const e = {course:String(x.course || '').trim().slice(0, 80), text:String(x.text || '').replace(/[*_]+/g, '').trim().slice(0, 160), date, time, note:String(x.note || '').trim().slice(0, 600), done:!!x.done};
      e.dup = existing.some(o => (o.course || '') === e.course && sameEvent(o, e));
      e.on = !e.done && !e.dup;
      return e;
    }).filter(e => e.text);

async function finishLecture(L, redo){

  try {
    const full = transcriptText(L);
    while ((L.notedChars || 0) < full.length && !R.notesErrFatal){
      const before = L.notedChars || 0; msg.textContent = 'Piszę notatki… ' + Math.round(before / Math.max(1, full.length) * 100) + '%';
      const rest = full.slice(before); let take = rest.slice(0, 6000);
      if (rest.length > 6000){ const cut = Math.max(take.lastIndexOf('. '), take.lastIndexOf('? '), take.lastIndexOf('! ')); if (cut > 3000) take = take.slice(0, cut + 1); }
      const user = notesUser(L, take);

      const sp = splitEvents(await chat(SYS_NOTES, user, sec => { msg.textContent = 'Piszę notatki… ' + pct + '%. Czekam ' + sec + ' s na limit Groq'; }));
      const add = sp.notes; addAutoEvents(L, sp.events);
      L.notedChars = before + take.length; if (add && !/^BRAK\.?$/i.test(add.trim())) L.notes = (L.notes ? L.notes + '\n\n' : '') + add.trim();
      await DB.put(L);
    }
    msg.textContent = 'Robię podsumowanie…'; L.summaryErr = ''; await summarize(L);
    if (!L.endedAt){ L.endedAt = L.startedAt + ((L.transcript.slice(-1)[0] || {}).t || 0) * 1000; L.durationSec = Math.round((L.endedAt - L.startedAt) / 1000); }
    L.status = 'done'; await DB.put(L); R = null; render(); toast('Gotowe');
  } catch (e){ R = null; render(); const m2 = $('#msg'); if (m2){ m2.className = 'err'; m2.textContent = 'Nie udało się: ' + e.message; } }
}

$('#viewer').addEventListener('click', ev => { if (ev.target.id === 'viewer') $('#viewer').hidden = true; });
document.addEventListener('input', ev => { if (ev.target.id === 'q'){ FILTER.q = ev.target.value; const a = $('#arch'); if (a) a.innerHTML = archiveHtml(); } });
$('#blackout').addEventListener('click', () => $('#blackout').classList.remove('on'));

/* ================= updates ================= */
const APP_VERSION = '2026-11-27.15';
let SW_REG = null, RELOAD_PENDING = false;
// a new version never interrupts a recording, notes being written or an edit: it waits for the next return to the archive
function reloadWhenIdle(){ if (R || WORKING || VIEW.name !== 'home'){ RELOAD_PENDING = true; return; } location.reload(); }
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !dbg().noSW){
  navigator.serviceWorker.register('sw.js').then(reg => { SW_REG = reg; }).catch(() => {});
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadWhenIdle(); hadController = true; });
}
async function checkUpdate(){
  if (R) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const v = String((await r.json()).version || '');
    if (!v || v === APP_VERSION || R) return;
    if (SW_REG && navigator.serviceWorker.controller){ try { await SW_REG.update(); } catch {} return; }
    const seen = sessionStorage.getItem('slucham_upd');
    if (seen === v) return;
    sessionStorage.setItem('slucham_upd', v);
    location.replace(location.pathname + '?v=' + encodeURIComponent(v) + location.hash);
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && RELOAD_PENDING && !R && !WORKING && VIEW.name !== 'edit'){ location.reload(); return; }
  if (document.visibilityState === 'visible' && !R){ checkUpdate(); recoverPending(); }
});

/* ================= boot ================= */
(async () => {
  await DB.open(); LECT = await DB.all(); sortLect();
  for (const l of LECT){
    if (normalizeEvents(l)) DB.put(l);
    if (l.status === 'recording'){ l.status = 'interrupted'; DB.put(l); }
    else if (l.status === 'done' && transcriptText(l).length - (l.notedChars || 0) > 200){ l.status = 'interrupted'; DB.put(l); }
  }
  render();
  checkUpdate();
  recoverPending();
})();
window.__slucham = {buildDocx, mdBlocks, mdHtml, cleanText, encodeWav, downTo16k, lectureMd, mdPlain, zipStore, crc32};
</script>
